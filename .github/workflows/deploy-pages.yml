name: Deploy LEARN prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate static prototype
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Prepare public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html 404.html styles.css app.js CNAME .nojekyll robots.txt site.webmanifest _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if page="$(curl -fsSL --max-time 15 "https://learn.hbkr.net/?build=$GITHUB_SHA")" && grep -Fq "HBKR LEARN | 문제로 배우는 AI 실습" <<< "$page"; then
              exit 0
            fi
            sleep 10
          done
          echo "Custom-domain verification failed: https://learn.hbkr.net/" >&2
          exit 1
